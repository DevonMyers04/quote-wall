services:
  db:
    image: postgres:17
    container_name: quotewall-db
    environment:
      POSTGRES_DB: quotewall
      POSTGRES_USER: quotewall
      POSTGRES_PASSWORD: quotewall
    ports:
      - "5433:5432"
    volumes:
      - quotewall-data:/var/lib/postgresql/data
volumes:
  quotewall-data: